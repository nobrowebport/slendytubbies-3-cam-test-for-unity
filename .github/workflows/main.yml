name: Build WebGL Game
on: [push, workflow_dispatch]

jobs:
  build:
    name: Compile WebGL Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files Cleanly
        run: |
          sudo apt-get install unzip -y
          
          # Force clean extraction directly to root
          unzip -o ProjectSettings.zip
          unzip -o Assets.zip
          unzip -o Packages.zip
          
          # Fix nested folder structures if they exist
          if [ -d "ProjectSettings/ProjectSettings" ]; then
            mv ProjectSettings/ProjectSettings/* ProjectSettings/
          fi
          if [ -d "Assets/Assets" ]; then
            mv Assets/Assets/* Assets/
          fi
          if [ -d "Packages/Packages" ]; then
            mv Packages/Packages/* Packages/
          fi
          
          rm -f *.zip

      - name: WebGL Compilation Engine (License Free)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          unityVersion: auto
