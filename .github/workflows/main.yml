name: Build WebGL Game
on: [push, workflow_dispatch]

jobs:
  build:
    name: Compile WebGL Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files Cleanly
        run: |
          sudo apt-get install unzip -y
          unzip -o ProjectSettings.zip
          unzip -o Assets.zip
          unzip -o Packages.zip
          rm -f *.zip

      - name: Pure WebAssembly Build Pipeline
        uses: sstainba/unity-builder@v1
        with:
          build-target: WebGL

      - name: Package Output for Itch
        uses: actions/upload-artifact@v4
        with:
          name: Slendytubbies3_WebGL_Build
          path: build/WebGL
